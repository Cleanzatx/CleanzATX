<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pick Your Day | CleanzATX</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --sky:#0284c7; --sky-l:#e0f2fe; --navy:#0c1a2e; --mid:#5b6b80; --line:#dbe4ee;
      --bg:#f4f8fb; --white:#fff; --good:#047857; --good-l:#d1fae5; --off:#94a3b8; --off-l:#eef2f6;
      --head:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--bg);color:var(--navy);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
    h1,h2{font-family:var(--head);margin:0;letter-spacing:-.01em;text-wrap:balance}
    button,input,textarea{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--sky);outline-offset:2px}
    header{background:var(--white);border-bottom:1px solid var(--line)}
    .bar{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-family:var(--head);font-weight:800;font-size:21px;color:var(--navy);text-decoration:none}
    .logo span{color:var(--sky)}
    .bar a.call{color:var(--sky);font-weight:600;text-decoration:none;font-size:15px}
    main{max-width:560px;margin:0 auto;padding:22px 16px 48px;display:grid;gap:18px}
    h1{font-size:26px}
    .lead{margin:6px 0 0;color:var(--mid)}
    .card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
    .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mid)}
    .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
    .week{display:grid;gap:8px}
    .wk-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
    .day{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;align-items:stretch}
    .date{display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums}
    .date b{font-family:var(--head);font-size:15px}
    .date span{font-size:12.5px;color:var(--mid)}
    .slot{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;display:grid;gap:1px;min-height:52px}
    .slot b{font-size:14px;font-weight:600}
    .slot span{font-size:12.5px;color:var(--mid)}
    .slot:hover:not(:disabled){border-color:var(--sky)}
    .slot[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
    .slot[aria-pressed="true"] span{color:#e0f2fe}
    .slot:disabled{cursor:default;background:var(--off-l);border-color:transparent;color:var(--off)}
    .slot:disabled span{color:var(--off)}
    .msg{color:var(--mid);font-size:15px;margin:0}
    form{display:grid;gap:12px}
    .chosen{background:var(--sky-l);border-radius:12px;padding:10px 12px;font-weight:600}
    label{display:grid;gap:5px;font-size:14px;font-weight:600}
    input,textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--white);font-size:16px;font-weight:400;width:100%}
    textarea{min-height:76px;resize:vertical}
    .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    .cta{border:0;border-radius:12px;padding:15px;background:var(--sky);color:#fff;font-family:var(--head);font-weight:800;font-size:17px;cursor:pointer}
    .cta:disabled{background:var(--off-l);color:var(--off);cursor:not-allowed}
    .fine{font-size:13px;color:var(--mid);margin:0}
    .err{color:#b91c1c;font-size:14px;margin:0}
    .done{text-align:left}
    .check{width:52px;height:52px;border-radius:50%;background:var(--good-l);color:var(--good);display:grid;place-items:center;font-size:26px;font-weight:800}
    [hidden]{display:none!important}
    @media (max-width:380px){.day{grid-template-columns:64px 1fr 1fr}}
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="logo" href="/">Cleanz<span>ATX</span></a>
      <a class="call" href="tel:+15125180512">(512) 518-0512</a>
    </div>
  </header>

  <main>
    <section id="pickView">
      <h1>Pick your cleaning day</h1>
      <p class="lead">Tap an open morning or afternoon. Booked times are grayed out.</p>
    </section>

    <section class="card" id="calCard" aria-label="Open days">
      <div class="legend">
        <span><i style="border:1px solid var(--line);background:var(--white)"></i>Open</span>
        <span><i style="background:var(--off-l)"></i>Booked</span>
      </div>
      <p class="msg" id="calMsg">Loading our calendar…</p>
      <div id="cal" class="week"></div>
    </section>

    <section class="card" id="formCard" hidden>
      <form id="bookForm" novalidate>
        <div class="chosen" id="chosen"></div>
        <label for="name">Your name
          <input id="name" name="name" autocomplete="name" required />
        </label>
        <label for="phone">Mobile number
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required />
        </label>
        <label for="address">Home address
          <input id="address" name="address" autocomplete="street-address" />
        </label>
        <label for="notes">Anything we should know? (gate code, pets)
          <textarea id="notes" name="notes"></textarea>
        </label>
        <div class="hp" aria-hidden="true"><label for="website">Website<input id="website" name="website" tabindex="-1" autocomplete="off" /></label></div>
        <p class="err" id="formErr" hidden></p>
        <button class="cta" id="submitBtn" type="submit">Book this day</button>
        <p class="fine">We'll text you to confirm. Need a different time? Call or text (512) 518-0512.</p>
      </form>
    </section>

    <section class="card done" id="doneView" hidden>
      <div class="check" aria-hidden="true">✓</div>
      <h2>You're on the calendar</h2>
      <p class="msg" id="doneLine"></p>
      <p class="fine">Questions? Call or text (512) 518-0512.</p>
    </section>
  </main>

  <script>
  (function () {
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var SLOT_TEXT = { am: 'Morning, 8 to 9 AM arrival', pm: 'Afternoon, 12 to 1 PM arrival' };
    var pick = null;
    var $ = function (id) { return document.getElementById(id); };

    function parts(iso) { var p = iso.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
    function longDate(iso, wd) { var p = parts(iso); return DAYS[wd] + ', ' + MONTHS[p.m] + ' ' + p.d; }

    function slotButton(day, key) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot';
      var booked = day[key];
      b.innerHTML = '<b>' + (key === 'am' ? 'Morning' : 'Afternoon') + '</b><span>' + (booked ? 'Booked' : (key === 'am' ? '8 to 9 AM arrival' : '12 to 1 PM arrival')) + '</span>';
      b.disabled = booked;
      b.setAttribute('aria-label', longDate(day.date, day.weekday) + ' ' + (key === 'am' ? 'morning' : 'afternoon') + (booked ? ', booked' : ', open'));
      b.setAttribute('aria-pressed', pick && pick.date === day.date && pick.slot === key ? 'true' : 'false');
      if (!booked) b.addEventListener('click', function () { choose(day, key); });
      return b;
    }

    var DATA = [];
    function render() {
      var cal = $('cal');
      cal.innerHTML = '';
      var weekdays = DATA.filter(function (d) { return d.open; });
      var lastMonday = null;
      weekdays.forEach(function (day) {
        if (day.weekday === 1 || lastMonday === null) {
          var lbl = document.createElement('div');
          lbl.className = 'wk-label';
          var p = parts(day.date);
          lbl.textContent = 'Week of ' + MONTHS[p.m] + ' ' + p.d;
          cal.appendChild(lbl);
          lastMonday = day.date;
        }
        var row = document.createElement('div');
        row.className = 'day';
        var p2 = parts(day.date);
        row.innerHTML = '<div class="date"><b>' + DAYS[day.weekday].slice(0, 3) + ' ' + p2.d + '</b><span>' + MONTHS[p2.m] + '</span></div>';
        row.appendChild(slotButton(day, 'am'));
        row.appendChild(slotButton(day, 'pm'));
        cal.appendChild(row);
      });
      var anyOpen = weekdays.some(function (d) { return !d.am || !d.pm; });
      $('calMsg').hidden = anyOpen;
      if (!anyOpen) { $('calMsg').hidden = false; $('calMsg').textContent = 'We are fully booked for the next 3 weeks. Call or text (512) 518-0512 and we will find you a day.'; }
    }

    function choose(day, key) {
      pick = { date: day.date, slot: key, weekday: day.weekday };
      render();
      $('chosen').textContent = longDate(day.date, day.weekday) + ' · ' + SLOT_TEXT[key];
      $('formCard').hidden = false;
      $('formErr').hidden = true;
      $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(function () { $('name').focus({ preventScroll: true }); }, 400);
    }

    fetch('/api/availability', { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error('bad');
        DATA = d.days || [];
        $('calMsg').hidden = true;
        render();
      })
      .catch(function () {
        $('calMsg').textContent = "Our calendar didn't load. Call or text (512) 518-0512 and we'll book you in.";
      });

    $('bookForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = $('formErr');
      var name = $('name').value.trim();
      var phone = $('phone').value.trim();
      if (!pick) { err.textContent = 'Pick a morning or afternoon above first.'; err.hidden = false; return; }
      if (!name || phone.replace(/\D/g, '').length < 10) { err.textContent = 'Add your name and a 10 digit phone number.'; err.hidden = false; return; }
      err.hidden = true;
      var btn = $('submitBtn');
      btn.disabled = true; btn.textContent = 'Booking…';
      fetch('/api/book-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name, phone: phone, address: $('address').value, notes: $('notes').value,
          website: $('website').value, date: pick.date, slot: pick.slot
        })
      })
        .then(function (r) { return r.json().then(function (d) { if (!r.ok || !d.ok) throw new Error(d.error || 'failed'); }); })
        .then(function () {
          $('pickView').hidden = true; $('calCard').hidden = true; $('formCard').hidden = true;
          $('doneLine').textContent = longDate(pick.date, pick.weekday) + ', ' + SLOT_TEXT[pick.slot].toLowerCase() + '. We\'ll text you to confirm.';
          $('doneView').hidden = false;
          window.scrollTo(0, 0);
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = 'Book this day';
          err.textContent = "That didn't go through. Try again, or call or text (512) 518-0512.";
          err.hidden = false;
        });
    });
  })();
  </script>
</body>
</html>
